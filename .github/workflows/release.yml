name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows Inno 安装包与便携包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/AgentHub/frontend/package-lock.json
      - name: 校验发版版本
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') { throw '只能从 vX.Y.Z tag 发版' }
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          [xml]$props = Get-Content -Raw src/Directory.Build.props
          $version = [string]$props.Project.PropertyGroup.Version
          $latest = Get-Content -Raw latest.json | ConvertFrom-Json
          if ($tag -ne $version -or $tag -ne [string]$latest.version) { throw "tag $tag、props $version、latest.json $($latest.version) 不一致" }
      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: 构建安装包与便携 ZIP
        shell: pwsh
        run: |
          pack/windows/pack.ps1
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          foreach ($name in @("AgentHub-$version-win-x64.exe", "AgentHub-$version-win-x64.zip")) {
            $file = Join-Path dist $name
            if (-not (Test-Path -LiteralPath $file) -or (Get-Item -LiteralPath $file).Length -le 0) { throw "Windows 产物缺失或为空: $name" }
            Write-Host "$name $((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/AgentHub-*-win-x64.exe
            dist/AgentHub-*-win-x64.zip
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS DMG（arm64 + x64）
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/AgentHub/frontend/package-lock.json
            src/AgentHub.Mac/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src/AgentHub.Mac/src-tauri/target
          key: macos-cargo-${{ hashFiles('src/AgentHub.Mac/src-tauri/Cargo.lock') }}
          restore-keys: macos-cargo-
      - name: 构建双架构 DMG
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '只能从 vX.Y.Z tag 发版'
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          props_version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Directory.Build.props | head -1)"
          latest_version="$(node -p "require('./latest.json').version")"
          [[ "$version" == "$props_version" && "$version" == "$latest_version" ]]
          bash pack/macos/build.sh
          bash pack/macos/build.sh x64
          test -s "dist/macos/dmg/AgentHub-${version}-mac-arm64.dmg"
          test -s "dist/macos/dmg/AgentHub-${version}-mac-x64.dmg"
          shasum -a 256 dist/macos/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/macos/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0

  publish:
    name: 发布完整 Release 与静态更新清单
    runs-on: windows-latest
    needs: [windows, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist/github-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist/github-assets
      - name: 校验资产并发布 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GITEE_TOKEN)) { throw '请先配置 GITEE_TOKEN Actions secret（projects 权限）' }
          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $tag -notmatch '^v\d+\.\d+\.\d+$') { throw '只能从 vX.Y.Z tag 发版' }
          $version = $tag -replace '^v', ''
          $names = @("AgentHub-$version-win-x64.exe", "AgentHub-$version-win-x64.zip", "AgentHub-$version-mac-arm64.dmg", "AgentHub-$version-mac-x64.dmg")
          $assetsDir = (Resolve-Path dist/github-assets).Path
          $files = foreach ($name in $names) {
            $path = Join-Path $assetsDir $name
            if (-not (Test-Path -LiteralPath $path) -or (Get-Item -LiteralPath $path).Length -le 0) { throw "发布资产缺失或为空: $name" }
            Get-Item -LiteralPath $path
          }
          $extra = @(Get-ChildItem -LiteralPath $assetsDir -File | Where-Object { $_.Name -notin $names })
          if ($extra.Count) { throw "出现意外发布资产: $($extra.Name -join ', ')" }

          # 首次创建草稿；重跑时只允许补传草稿缺失的资产，不替换已公开资产。
          # 注意：draft 不会出现在 GET /releases/tags/{tag}，只能从列表接口按 tag_name 找。
          function Get-Release {
            $all = gh api "repos/sept13-yu/AgentHub/releases?per_page=30" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw '列出 GitHub Release 失败' }
            return @($all | Where-Object { $_.tag_name -eq $tag }) | Select-Object -First 1
          }
          $remote = Get-Release
          if (-not $remote) {
            $migrationNotes = @'
          ## 旧版 Windows 用户：请手动换装

          旧版 Velopack 客户端无法在应用内升级到此版本。请先在 Windows「已安装的应用」中卸载旧版，再下载本页的 `AgentHub-{version}-win-x64.exe` 安装。不要直接把新版安装到仍有 `Update.exe` 和 `current` 的旧目录。

          配置和用量库保存在 `%APPDATA%\AgentHub`，本机缓存保存在 `%LOCALAPPDATA%\AgentHub.Local`，与程序目录分开。卸载前可按需备份。便携版请下载 `AgentHub-{version}-win-x64.zip`，后续更新需手动替换文件。
          '@
            $migrationNotes = $migrationNotes.Replace('{version}', $version)
            gh release create $tag --repo sept13-yu/AgentHub --title "AgentHub $version" --notes $migrationNotes --generate-notes --draft --verify-tag
            if ($LASTEXITCODE -ne 0) { throw '创建 GitHub Release 草稿失败' }
            $remote = Get-Release
            if (-not $remote) { throw '创建后仍找不到 GitHub Release 草稿' }
          }
          foreach ($file in $files) {
            $asset = @($remote.assets | Where-Object { $_.name -eq $file.Name })
            if ($asset.Count -eq 0) {
              if (-not $remote.draft) { throw "已发布的 Release 缺少资产: $($file.Name)" }
              gh release upload $tag $file.FullName --repo sept13-yu/AgentHub
              if ($LASTEXITCODE -ne 0) { throw "上传资产失败: $($file.Name)" }
            }
          }
          $remote = Get-Release
          if (-not $remote) { throw '读取 GitHub Release 资产失败' }
          if (@($remote.assets).Count -ne 4) { throw 'GitHub Release 资产数量不是 4' }
          foreach ($file in $files) {
            $asset = @($remote.assets | Where-Object { $_.name -eq $file.Name })
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.Count -ne 1 -or [long]$asset[0].size -ne $file.Length -or $asset[0].digest -ne "sha256:$hash") {
              throw "GitHub Release 资产大小或 SHA-256 不一致: $($file.Name)"
            }
          }
          if ($remote.draft) {
            gh release edit $tag --repo sept13-yu/AgentHub --draft=false
            if ($LASTEXITCODE -ne 0) { throw '公开 GitHub Release 失败' }
          }
          & pack/publish-update-feed.ps1 -Tag $tag -AssetsDir $assetsDir -Publish
