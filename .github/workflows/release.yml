name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/AgentHub/frontend/package-lock.json

      - name: 校验 tag 与 csproj 版本一致
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}" -replace '^v',''
          [xml]$p = Get-Content -Raw src/AgentHub/AgentHub.csproj
          $pg = $p.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1
          $v = [string]$pg.Version
          if ($tag -ne $v) { throw "tag v$tag 与 csproj Version $v 不一致" }

      - name: 发布 win-x64
        shell: pwsh
        run: pack/windows/pack.ps1 -PublishOnly

      - name: 安装 vpk
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.0

      - name: 拉取上一版（给增量包用，首发允许失败）
        continue-on-error: true
        shell: pwsh
        run: |
          vpk download github --repoUrl https://github.com/sept13-yu/AgentHub `
            --token ${{ secrets.GITHUB_TOKEN }} -o dist/Releases

      - name: vpk pack（安装包 + full + 对基 delta）
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v',''
          vpk pack -u AgentHub -v $ver `
            -p dist/win-x64 -e AgentHub.exe --icon src/AgentHub/assets/agenthub.ico -o dist/Releases
          $setup = Join-Path dist/Releases 'AgentHub-win-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw "vpk 没有打出安装包: $setup" }
          Copy-Item -LiteralPath $setup -Destination (Join-Path dist "AgentHub-Setup-$ver-win-x64.exe") -Force

      # 用户只下带版本号的安装包。nupkg / releases.win.json 给托盘增量更新，不是第二套安装包。
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AgentHub-Setup-*-win-x64.exe
            dist/Releases/*.nupkg
            dist/Releases/releases.win.json
            dist/Releases/assets.win.json
            dist/Releases/RELEASES
          generate_release_notes: true
