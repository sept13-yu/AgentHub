name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/AgentHub/frontend/package-lock.json

      - name: 校验 tag 与 csproj 版本一致
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}" -replace '^v',''
          [xml]$p = Get-Content -Raw src/AgentHub/AgentHub.csproj
          $pg = $p.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1
          $v = [string]$pg.Version
          if ($tag -ne $v) { throw "tag v$tag 与 csproj Version $v 不一致" }

      - name: 发布 win-x64
        shell: pwsh
        run: pack/windows/pack.ps1 -PublishOnly

      - name: 安装 vpk
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.0

      # 重发同版本时必须先删旧 Release，否则 download 会把本版当基线，旧 zip 也会留着。
      - name: 清掉本 tag 的旧 Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release delete "${env:GITHUB_REF_NAME}" --yes

      - name: 拉取上一版（给增量包用，首发允许失败）
        continue-on-error: true
        shell: pwsh
        run: |
          vpk download github --repoUrl https://github.com/sept13-yu/AgentHub `
            --token ${{ secrets.GITHUB_TOKEN }} -o dist/Releases

      - name: vpk pack（full + 对基 delta）
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v',''
          vpk pack -u AgentHub -v $ver --noPortable `
            -p dist/win-x64 -e AgentHub.exe --icon src/AgentHub/assets/agenthub.ico -o dist/Releases
          $setup = Join-Path dist/Releases 'AgentHub-win-Setup.exe'
          if (-not (Test-Path -LiteralPath $setup)) { throw "vpk 没有打出安装包: $setup" }

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: 打带目录选择的安装包
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace '^v',''
          pack/windows/pack-bootstrap.ps1 `
            -SetupExe dist/Releases/AgentHub-win-Setup.exe `
            -Version $ver `
            -OutputDir ((Resolve-Path dist).Path)
          $upload = 'dist/github-assets'
          New-Item -ItemType Directory -Force $upload | Out-Null
          Copy-Item -LiteralPath (Join-Path dist "AgentHub-Setup-$ver-win-x64.exe") -Destination $upload
          Get-ChildItem -LiteralPath dist/Releases -Filter "AgentHub-$ver-*.nupkg" |
            Copy-Item -Destination $upload
          foreach ($name in @('releases.win.json', 'assets.win.json', 'RELEASES')) {
            $src = Join-Path dist/Releases $name
            if (Test-Path -LiteralPath $src) { Copy-Item -LiteralPath $src -Destination $upload }
          }
          Get-ChildItem -LiteralPath $upload | ForEach-Object { Write-Host $_.Name }

      # 用户只下带版本号的安装包。nupkg / json 给托盘增量更新，不是第二套安装包。
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/github-assets/*
          generate_release_notes: true
