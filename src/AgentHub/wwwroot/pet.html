<!doctype html>
<html lang="zh-CN" data-size="medium">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentHub Pet</title>
    <meta name="robots" content="noindex" />
    <style>
      /* 移植 TokenTracker pet.html：分层窗合成 WebView2 透明度，未绘制区域穿透桌面。 */
      html, body, #pet-root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent !important;
        overflow: hidden;
      }
      body {
        cursor: grab;
        -webkit-user-select: none;
        user-select: none;
      }
      body:active { cursor: grabbing; }
      #pet-root {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #bubble {
        flex: none;
        min-height: 72px;
        height: auto;
        width: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        pointer-events: none;
        box-sizing: border-box;
        padding: 0 12px 6px;
      }
      html[data-size="small"] #bubble { min-height: 58px; padding: 0 8px 6px; }
      html[data-size="large"] #bubble { min-height: 88px; }
      #bubble span {
        display: none;
        overflow: visible;
        max-width: 100%;
        padding: 8px 12px 10px;
        border-radius: 16px;
        background: linear-gradient(145deg, rgba(18, 20, 24, 0.82), rgba(30, 32, 38, 0.72));
        border: 1px solid rgba(255, 255, 255, 0.24);
        color: rgba(255, 255, 255, 0.94);
        font: 600 12px/1.45 system-ui, "Segoe UI", sans-serif;
        letter-spacing: 0.01em;
        white-space: pre-line;
        text-align: center;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(18px) saturate(145%);
        -webkit-backdrop-filter: blur(18px) saturate(145%);
      }
      #bubble.is-on span { display: block; }
      #sprite {
        flex: 1;
        width: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        transform-origin: 50% 92%;
        transition: transform 120ms ease-out;
      }
      #sprite svg, #sprite .frame {
        width: auto;
        height: 100%;
        max-width: 100%;
      }
      #sprite.is-left .frame { transform: scaleX(-1); }
      #sprite.is-atlas .frame,
      #sprite .atlas {
        width: calc(100% * 192 / 208);
        height: 100%;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="pet-root">
      <div id="bubble" role="status" aria-live="polite"><span id="bubble-text"></span></div>
      <div id="sprite" role="img" aria-label="桌面宠物"><div class="frame" id="frame"></div></div>
    </div>
    <script type="module" src="/js/pet.js"></script>
  </body>
</html>
